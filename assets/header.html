<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nearhost header</title>
    <!--
      Source for every Nearhost README header. render.sh draws one PNG per
      variant in this directory, filling in INSTALL and SUB, and points LANDING
      at a checkout of nearhost/landing for the fonts.
      Render with: sh assets/render.sh
    -->
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        font-weight: 300 700;
        src: url('LANDING/node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'DM Sans';
        font-weight: 100 1000;
        src: url('LANDING/node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 400;
        src: url('LANDING/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2')
          format('woff2');
      }
      :root {
        --ground: #111013;
        --surface: #19171c;
        --line: #2f2a33;
        --text: #f4eef2;
        --body: #d9ccd5;
        --faint: #a08f9b;
        --beacon: #ff70c8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      .card {
        position: relative;
        width: 1280px;
        height: 460px;
        overflow: hidden;
        border-radius: 28px;
        background: var(--ground);
        color: var(--text);
        padding: 52px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'DM Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .ghost {
        position: absolute;
        right: -170px;
        top: -70px;
        width: 560px;
        height: 560px;
        opacity: 0.09;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .word {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 30px;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 88px;
        line-height: 0.95;
        letter-spacing: -0.045em;
      }
      .accent {
        color: var(--beacon);
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .cmd {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 18px;
      }
      .cmd span {
        color: var(--faint);
      }
      .sub {
        font-size: 20px;
        color: var(--body);
      }
      .sub code {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.92em;
        color: var(--beacon);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="ghost" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M13 17l15 15-15 15" fill="none" stroke="#ff70c8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="46" cy="44" r="7.5" fill="#f4eef2" />
      </svg>
      <div class="lockup">
        <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M13 17l15 15-15 15" fill="none" stroke="#ff70c8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="46" cy="44" r="7.5" fill="#f4eef2" />
        </svg>
        <span class="word">nearhost</span>
      </div>
      <h1>Run it anywhere.<br />Open it <span class="accent">here</span>.</h1>
      <div class="foot">
        <div class="cmd"><span>$</span> INSTALL</div>
        <div class="sub">SUB</div>
      </div>
    </div>
  </body>
</html>
