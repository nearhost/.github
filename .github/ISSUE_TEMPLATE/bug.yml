name: Bug report
description: Something in Nearhost does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not use this form. Use the link on the issue chooser to report it privately.
  - type: input
    id: version
    attributes:
      label: Nearhost version
      description: The output of `nearhost --version`.
      placeholder: nearhost 0.8.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Your OS and version, and your CPU architecture if it is unusual.
      placeholder: macOS 15.1 on Apple silicon, or Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed Nearhost
      options:
        - Homebrew
        - npm
        - install script
        - from source
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of nearhost doctor
      description: Paste the whole output. Remove anything private, such as host names.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you ran, in order, starting from a clean state if you can.
      placeholder: |
        1. nearhost add ...
        2. nearhost up
        3. Open https://myapp.test
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
      description: Include any error messages.
    validations:
      required: true
